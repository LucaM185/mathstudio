# Release: push a tag vX.Y.Z (`npm run release` bumps the version, tags and pushes) →
#   1. build the Linux AppImage + .deb in Docker (packaging/linux/build.sh),
#   2. install and drive them in a clean Ubuntu 24.04 container (packaging/linux/test.sh),
#   3. let the AppImage update itself to a newer build of the same code (packaging/linux/test-update.sh),
#   4. publish a GitHub Release with the packages + latest-linux.yml, which the in-app updater
#      (Settings → Updates) reads. The website's download button points at
#      https://github.com/<owner>/<repo>/releases/latest/download/MathStudio-x86_64.AppImage
# "Run workflow" by hand (workflow_dispatch) does 1–3 only: a dry run, no release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::tag $GITHUB_REF_NAME but package.json says $V"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3
      # exposes the Actions cache token so plain `docker buildx` can use --cache-to type=gha
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Build AppImage + .deb
        timeout-minutes: 60
        env:
          MS_BUILDX_ARGS: --cache-from type=gha,scope=linux --cache-to type=gha,mode=max,scope=linux
        run: packaging/linux/build.sh

      - name: Test the packages in a clean Ubuntu 24.04
        timeout-minutes: 75
        run: packaging/linux/test.sh

      - name: Test a real self-update (AppImage → newer AppImage)
        timeout-minutes: 45
        env:
          MS_BUILDX_ARGS: --cache-from type=gha,scope=linux
        run: packaging/linux/test-update.sh

      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-out
          path: release/test-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # gh uploads the files to a draft and publishes it at the end, so the updater never sees a
        # release whose latest-linux.yml points at files that are not there yet
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/MathStudio-x86_64.AppImage \
            release/MathStudio-amd64.deb \
            release/latest-linux.yml \
            --title "MathStudio ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
